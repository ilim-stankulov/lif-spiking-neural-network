# Tiny Tapeout project information
project:
  title:        "4-Neuron LIF Spiking Neural Network"
  author:       "Ilim Stankulov"
  discord:      "aprickwithaguitar"
  description:  "A simple 4-neuron spiking neural network implementing the LIF model"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x2"

  top_module:  "tt_um_lif_snn"

  source_files:
    - "project.v"
    - "lif_components.v"

pinout:
  # Inputs
  ui[0]: "s_data — serial weight bit input"
  ui[1]: "s_clk_en — serial clock enable"
  ui[2]: "mode_prog — 1=program weights, 0=run"
  ui[3]: "obs_step — rising edge selects next neuron to observe"
  ui[4]: "stim_0 — external input spike 0"
  ui[5]: "stim_1 — external input spike 1"
  ui[6]: "stim_2 — external input spike 2"
  ui[7]: "stim_3 — external input spike 3"

  # Outputs
  uo[0]: "spike_0 — neuron 0 spike output"
  uo[1]: "spike_1 — neuron 1 spike output"
  uo[2]: "spike_2 — neuron 2 spike output"
  uo[3]: "spike_3 — neuron 3 spike output"
  uo[4]: "prog_done — all 128 weight bits loaded"
  uo[5]: "obs_sel[0] — observed neuron index, low bit"
  uo[6]: "obs_sel[1] — observed neuron index, high bit"
  uo[7]: ""

  # Bidirectional pins — outputs
  uio[0]: "v_mem[0] — membrane potential of observed neuron"
  uio[1]: "v_mem[1]"
  uio[2]: "v_mem[2]"
  uio[3]: "v_mem[3]"
  uio[4]: "v_mem[4]"
  uio[5]: "v_mem[5]"
  uio[6]: "v_mem[6]"
  uio[7]: "v_mem[7] — sign bit"

# Do not change!
yaml_version: 6
